# Local verification: runs the same checks as the GitHub Actions workflows.
#
#   pip install tox
#   tox                 # tests on every supported Python found on this machine + build check
#   tox -e py311        # tests on one Python version
#   tox -e build        # build sdist/wheel and validate the metadata
#
# Python versions that are not installed locally are skipped.

[tox]
envlist = py39, py310, py311, py312, build
skip_missing_interpreters = true

[testenv]
description = Run the test suite
deps = pytest
commands = pytest -v {posargs:tests/}

[testenv:build]
description = Build sdist and wheel and validate the distribution metadata
skip_install = true
deps =
    build
    twine
commands =
    python -c "import shutil; shutil.rmtree('{toxworkdir}/dist', ignore_errors=True)"
    python -m build --outdir {toxworkdir}/dist
    twine check {toxworkdir}/dist/*
