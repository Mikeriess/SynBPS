name: Publish package 📦 to PyPI

# Publishing is a deliberate, manual action: this workflow runs only when a
# GitHub release is published (Releases -> Draft a new release -> Publish).
# Merging to main does not publish anything; see src/contributing.md.
on:
  release:
    types: [published]

jobs:
  build-n-publish:
    name: Build and publish package 📦 to PyPI
    runs-on: ubuntu-latest
    # Optional extra protection: configure the "pypi" environment under
    # Settings -> Environments to require a manual approval before this job runs.
    environment: pypi

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Check that the release tag matches the package version
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        TAG_VERSION="${RELEASE_TAG#v}"
        PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
        echo "Release tag:            $RELEASE_TAG (version $TAG_VERSION)"
        echo "pyproject.toml version: $PACKAGE_VERSION"
        if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
          echo "::error::Release tag '$RELEASE_TAG' does not match the version in pyproject.toml ('$PACKAGE_VERSION'). Nothing was published."
          exit 1
        fi

    - name: Install package and test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e . pytest

    - name: Run tests
      run: pytest -v tests/

    - name: Install build tools
      run: pip install build twine

    - name: Build sdist and wheel
      # dist/ is tracked in git and contains old releases; start from a clean directory
      run: |
        rm -rf dist
        python -m build

    - name: Check distribution metadata
      run: twine check dist/*

    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
